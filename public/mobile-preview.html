<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #e8dccd;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }
      .phone {
        width: min(390px, 100vw);
        height: min(844px, 100vh);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 16px 42px rgba(64, 43, 29, .24);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="phone"><iframe src="/" title="手机端游戏预览"></iframe></main>
  </body>
</html>
